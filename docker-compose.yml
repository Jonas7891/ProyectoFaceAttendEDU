# FaceAttend EDU — root orchestrator (run every stack command from FULL/).
# Includes database/ (postgres + liquibase) and back-end/ (microservices +
# Kong). Interpolation variables for ALL included files resolve from FULL/.env
# (see .env.example). Start everything with:  docker compose up --build -d
include:
  - ./database/docker-compose.yml
  - ./back-end/docker-compose.yml
  # frontend-web (:8090 → nginx :80) y kong-gateway (:8080) se sirven desde aquí.
  # Solo frontend + gateway (tras primer build del backend):
  #   docker compose up frontend-web kong-gateway

services:
  postgres:
    networks:
      - default
      - faceattend-net

  authorization-liquibase:
    depends_on:
      identity-liquibase:
        condition: service_completed_successfully

  academic-liquibase:
    depends_on:
      authorization-liquibase:
        condition: service_completed_successfully

  scheduling-liquibase:
    depends_on:
      academic-liquibase:
        condition: service_completed_successfully

  attendance-liquibase:
    depends_on:
      scheduling-liquibase:
        condition: service_completed_successfully

  biometric-liquibase:
    depends_on:
      attendance-liquibase:
        condition: service_completed_successfully

  configuration-liquibase:
    depends_on:
      biometric-liquibase:
        condition: service_completed_successfully

  notification-liquibase:
    depends_on:
      configuration-liquibase:
        condition: service_completed_successfully

  ms-identity:
    depends_on:
      identity-liquibase:
        condition: service_completed_successfully

  ms-authorization:
    depends_on:
      authorization-liquibase:
        condition: service_completed_successfully

  ms-academic:
    depends_on:
      academic-liquibase:
        condition: service_completed_successfully

  ms-scheduling:
    depends_on:
      scheduling-liquibase:
        condition: service_completed_successfully

  ms-attendance:
    depends_on:
      attendance-liquibase:
        condition: service_completed_successfully

  ms-biometric:
    depends_on:
      biometric-liquibase:
        condition: service_completed_successfully

  ms-configuration:
    depends_on:
      configuration-liquibase:
        condition: service_completed_successfully

  ms-notification:
    depends_on:
      notification-liquibase:
        condition: service_completed_successfully

  # ──────────────────────────────────────────────────────────────
  # Frontend — Expo Web estático + nginx (SPA /, /login, /register,
  # /dashboard). Lives here (not in back-end/): it is a presentation
  # concern and consumes the backend only via gateway Kong :8080.
  # ──────────────────────────────────────────────────────────────
  frontend-web:
    build:
      context: ./front-end/Web
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:8080}
    image: faceattend/frontend-web:latest
    container_name: faceattend-frontend-web
    depends_on:
      kong-gateway:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8090}:80"
    networks:
      - faceattend-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
