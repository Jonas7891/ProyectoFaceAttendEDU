databaseChangeLog:
  - changeSet:
      id: att-001-seed-justification-type-table
      author: Andres Gutierrez
      context: seed
      splitStatements: false
      changes:
        - sql:
            sql: |
              INSERT INTO attendance.justification_type (justification_type_id, name, description, requires_attachment, status, created_at, updated_at, row_version) VALUES
                (1, 'Incapacidad medica', 'Justificacion por incapacidad medica certificada', TRUE, TRUE, NOW(), NOW(), 1),
                (2, 'Calamidad domestica', 'Justificacion por calamidad domestica', TRUE, TRUE, NOW(), NOW(), 1),
                (3, 'Cita medica', 'Justificacion por cita medica programada', TRUE, TRUE, NOW(), NOW(), 1),
                (4, 'Compromiso academico', 'Justificacion por actividad academica externa', FALSE, TRUE, NOW(), NOW(), 1),
                (5, 'Permiso personal', 'Justificacion por permiso personal del aprendiz', FALSE, TRUE, NOW(), NOW(), 1)
      rollback:
        - sql:
            sql: DELETE FROM attendance.justification_type;
