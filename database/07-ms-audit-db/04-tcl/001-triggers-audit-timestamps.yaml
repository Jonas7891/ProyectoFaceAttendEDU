databaseChangeLog:
  - changeSet:
      id: audit-001-create-audit-timestamp-trigger
      author: Andres Gutierrez
      changes:
        - sqlFile:
            path: 001-create-audit-timestamp-trigger.sql
            relativeToChangelogFile: true
            splitStatements: false
        - sql:
            sql: |
              CREATE TRIGGER trg_audit_timestamps
              BEFORE INSERT OR UPDATE ON audit.audit_log
              FOR EACH ROW
              EXECUTE FUNCTION audit.fn_audit_timestamps();
        - sql:
            sql: |
              CREATE TRIGGER trg_error_log_audit_timestamps
              BEFORE INSERT OR UPDATE ON audit.error_log
              FOR EACH ROW
              EXECUTE FUNCTION audit.fn_audit_timestamps();
      rollback:
        - sql:
            sql: DROP TRIGGER IF EXISTS trg_audit_timestamps ON audit.audit_log;
        - sql:
            sql: DROP TRIGGER IF EXISTS trg_error_log_audit_timestamps ON audit.error_log;
        - sqlFile:
            path: 001-create-audit-timestamp-trigger-rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
