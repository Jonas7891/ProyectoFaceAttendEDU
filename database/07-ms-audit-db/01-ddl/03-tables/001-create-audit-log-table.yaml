databaseChangeLog:
  - changeSet:
      id: audit-001-create-audit-log-table
      author: Andres Gutierrez
      splitStatements: false
      changes:
        - sql:
            sql: |
              CREATE TABLE audit.audit_log (
                audit_log_id BIGSERIAL,
                school_id INT NULL,
                actor_id UUID NULL,
                action VARCHAR(255) NOT NULL,
                aggregate_type VARCHAR(255) NOT NULL,
                aggregate_id VARCHAR(255) NULL,
                description TEXT NULL,
                source_ip VARCHAR(45) NULL,
                application VARCHAR(255) NULL,
                occurred_at TIMESTAMP NOT NULL,
                created_at TIMESTAMP NOT NULL,
                updated_at TIMESTAMP NULL,
                deleted_at TIMESTAMP NULL,
                created_by UUID NULL,
                updated_by UUID NULL,
                deleted_by UUID NULL,
                row_version BIGINT NOT NULL DEFAULT 1,
                CONSTRAINT audit_log_pkey PRIMARY KEY (audit_log_id)
              )
        - createIndex:
            tableName: audit_log
            schemaName: audit
            indexName: idx_audit_actor
            columns:
              - column:
                  name: actor_id
        - createIndex:
            tableName: audit_log
            schemaName: audit
            indexName: idx_audit_aggregate
            columns:
              - column:
                  name: aggregate_type
              - column:
                  name: aggregate_id
        - createIndex:
            tableName: audit_log
            schemaName: audit
            indexName: idx_audit_date
            columns:
              - column:
                  name: occurred_at
        - createIndex:
            tableName: audit_log
            schemaName: audit
            indexName: idx_audit_school
            columns:
              - column:
                  name: school_id
      rollback:
        - dropTable:
            tableName: audit_log
            schemaName: audit
