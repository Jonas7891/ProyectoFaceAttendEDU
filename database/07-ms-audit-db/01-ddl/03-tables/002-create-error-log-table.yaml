databaseChangeLog:
  - changeSet:
      id: audit-002-create-error-log-table
      author: Andres Gutierrez
      splitStatements: false
      changes:
        - sql:
            sql: |
              CREATE TABLE audit.error_log (
                error_id BIGSERIAL,
                school_id INT NULL,
                user_id UUID NULL,
                error_type VARCHAR(255) NOT NULL,
                description TEXT NOT NULL,
                source_ip VARCHAR(45) NULL,
                application VARCHAR(255) NULL,
                occurred_at TIMESTAMP NOT NULL,
                created_at TIMESTAMP NOT NULL,
                updated_at TIMESTAMP NULL,
                deleted_at TIMESTAMP NULL,
                created_by UUID NULL,
                updated_by UUID NULL,
                deleted_by UUID NULL,
                row_version BIGINT NOT NULL DEFAULT 1,
                CONSTRAINT error_log_pkey PRIMARY KEY (error_id)
              )
        - createIndex:
            tableName: error_log
            schemaName: audit
            indexName: idx_error_user
            columns:
              - column:
                  name: user_id
        - createIndex:
            tableName: error_log
            schemaName: audit
            indexName: idx_error_date
            columns:
              - column:
                  name: occurred_at
        - createIndex:
            tableName: error_log
            schemaName: audit
            indexName: idx_error_school
            columns:
              - column:
                  name: school_id
      rollback:
        - dropTable:
            tableName: error_log
            schemaName: audit
