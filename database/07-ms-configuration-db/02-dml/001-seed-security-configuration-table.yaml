databaseChangeLog:
  - changeSet:
      id: config-001-seed-security-configuration-table
      author: Andres Gutierrez
      context: seed
      splitStatements: false
      changes:
        - sql:
            sql: |
              INSERT INTO configuration.security_configuration (configuration_id, configuration_name, configuration_value, description, created_at, updated_at, row_version) VALUES
                (1, 'session_timeout_minutes', 480, 'Tiempo maximo de sesion en minutos', NOW(), NOW(), 1),
                (2, 'max_login_attempts', 5, 'Numero maximo de intentos de login', NOW(), NOW(), 1),
                (3, 'lockout_duration_minutes', 30, 'Duracion del bloqueo tras intentos fallidos', NOW(), NOW(), 1),
                (4, 'password_min_length', 8, 'Longitud minima de contrasena', NOW(), NOW(), 1),
                (5, 'require_password_change', TRUE, 'Requerir cambio de contrasena en primer login', NOW(), NOW(), 1)
      rollback:
        - sql:
            sql: DELETE FROM configuration.security_configuration;
