databaseChangeLog:
  - changeSet:
      id: id-001-seed-city-table
      author: Andres Gutierrez
      context: seed
      splitStatements: false
      changes:
        - sql:
            sql: |
              INSERT INTO identity.city (city_id, name, department, created_at, updated_at, row_version) VALUES
                (1, 'Bogota', 'Cundinamarca', NOW(), NOW(), 1),
                (2, 'Medellin', 'Antioquia', NOW(), NOW(), 1),
                (3, 'Cali', 'Valle del Cauca', NOW(), NOW(), 1),
                (4, 'Barranquilla', 'Atlantico', NOW(), NOW(), 1),
                (5, 'Cartagena', 'Bolivar', NOW(), NOW(), 1)
      rollback:
        - sql:
            sql: DELETE FROM identity.city
