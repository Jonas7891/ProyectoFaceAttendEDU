databaseChangeLog:
  - changeSet:
      id: auth-002-seed-permission-table
      author: Andres Gutierrez
      context: seed
      splitStatements: false
      changes:
        - sql:
            sql: |
              INSERT INTO "authorization".permission (permission_id, permission_name, description, created_at, updated_at, row_version) VALUES
                (1, 'person.create', 'Crear personas', NOW(), NOW(), 1),
                (2, 'person.read', 'Consultar personas', NOW(), NOW(), 1),
                (3, 'person.update', 'Actualizar personas', NOW(), NOW(), 1),
                (4, 'person.delete', 'Eliminar personas', NOW(), NOW(), 1),
                (5, 'school.create', 'Crear sedes', NOW(), NOW(), 1),
                (6, 'school.read', 'Consultar sedes', NOW(), NOW(), 1),
                (7, 'school.update', 'Actualizar sedes', NOW(), NOW(), 1),
                (8, 'enrollment.create', 'Crear matriculas', NOW(), NOW(), 1),
                (9, 'enrollment.read', 'Consultar matriculas', NOW(), NOW(), 1),
                (10, 'attendance.read', 'Consultar asistencias', NOW(), NOW(), 1),
                (11, 'attendance.update', 'Actualizar asistencias', NOW(), NOW(), 1),
                (12, 'justification.approve', 'Aprobar justificaciones', NOW(), NOW(), 1),
                (13, 'biometric.update', 'Solicitar actualizacion biometrica', NOW(), NOW(), 1),
                (14, 'configuration.manage', 'Gestionar configuracion', NOW(), NOW(), 1)
      rollback:
        - sql:
            sql: DELETE FROM "authorization".permission;
