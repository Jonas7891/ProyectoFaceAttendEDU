version: '3.8'

services:
  db-faceattend-edu:
    image: postgres:18
    container_name: db-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: faceattend_edu
    ports:
      - "5433:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d