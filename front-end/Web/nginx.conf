# SPA + API: el frontend es estático; /api/* va al gateway Kong.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Proxy opcional al gateway cuando el navegador usa origen relativo.
    # En producción se recomienda EXPO_PUBLIC_API_URL absoluto; esto cubre /api.
    location /api/ {
        proxy_pass http://kong-gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /health {
        access_log off;
        return 200 '{"status":"ok","service":"frontend-web"}';
        add_header Content-Type application/json;
    }

    # Fallback SPA para /, /login, /register, /dashboard
    location / {
        try_files $uri $uri/ /index.html;
    }
}
