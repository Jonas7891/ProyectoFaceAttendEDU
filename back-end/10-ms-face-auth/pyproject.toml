[tool.poetry]
name = "face-auth-service"
version = "0.1.0"
description = "Face and fingerprint authentication service"
packages = [{include = "face_auth"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pymongo = "^4.0.0"
psycopg = {extras = ["binary"], version = "^3.2.0"}
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
PyJWT = "^2.9.0"
numpy = "<2"
opencv-python-headless = "^4.8.0"
face-recognition = "^1.3.0"
Pillow = "^10.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
httpx = "^0.27.0"
ruff = "^0.8.0"
mypy = "^1.11.0"
bandit = "^1.7.0"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
