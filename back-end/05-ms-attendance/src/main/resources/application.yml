server:
  port: 8085
spring:
  application:
    name: attendance-service
  datasource:
    url: jdbc:postgresql://localhost:5432/faceattend_db?stringtype=unspecified
    username: postgres
    password: postgres
    hikari:
      schema: attendance
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: attendance
      hibernate.globally_quoted_identifiers: true
      hibernate.hbm2ddl.create_namespaces: true
  kafka:
    bootstrap-servers: localhost:9092
  liquibase:
    # Las migraciones viven en ../database/ (fuente canonica); el servicio no auto-migra.
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
