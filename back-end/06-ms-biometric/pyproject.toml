[tool.poetry]
name = "biometric-service"
version = "0.1.0"
description = "FaceAttend EDU Biometric Service — Python FastAPI per ADR-005"
authors = ["FaceAttend EDU Team"]
packages = [{include = "domain"}, {include = "application"}, {include = "infrastructure"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.28.0"}
pydantic = "^2.6.0"
pydantic-settings = "^2.1.0"
motor = "^3.3.0"
pymongo = "^4.6.0"
opencv-python = "^4.9.0"
numpy = "^1.26.0"
python-multipart = "^0.0.9"
structlog = "^24.1.0"
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
testcontainers = {extras = ["mongodb"], version = "^4.0.0"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
