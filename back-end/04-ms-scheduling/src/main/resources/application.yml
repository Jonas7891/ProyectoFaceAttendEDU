server:
  port: 8087
spring:
  application:
    name: scheduling-service
  datasource:
    url: jdbc:postgresql://localhost:5432/faceattend_db
    username: postgres
    password: postgres
    hikari:
      schema: scheduling
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: scheduling
      hibernate.globally_quoted_identifiers: true
      hibernate.hbm2ddl.create_namespaces: true
  kafka:
    bootstrap-servers: localhost:9092
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: scheduling
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
